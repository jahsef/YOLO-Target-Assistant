[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not perf" -ra
markers =
    perf: speed/latency measurement. records to tests/results, never fails on regression. opt-in via `pytest -m perf`
    gpu: needs a working CUDA device (cupy + torch). auto-skips otherwise
    engine: needs local .engine / bundle files under data/models (gitignored, so absent on a fresh clone)
    slow: takes more than a second
